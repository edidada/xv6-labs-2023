name: xv6 lab
on:
  push:
    branches: ['edidada/**']
  workflow_dispatch:
jobs:
  grade:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V and QEMU tools
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc gdb-multiarch
      - name: Build and grade
        run: |
          set -o pipefail
          mkdir -p .ci-results
          make grade 2>&1 | tee .ci-results/grade.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: lab-results
          path: |
            .ci-results/grade.log
            .ci-results/server.log
            xv6.out*
            packets.pcap
